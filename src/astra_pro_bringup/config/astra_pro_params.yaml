# Per-node parameters. Top-level keys must match node FULL names
# (namespace + node name):
#   '/camera/orbbec'                   <- orbbec composable node (namespace /<camera_name>, fixed node name)
#   '/camera/color/v4l2_camera_node' <- v4l2 node
# Renaming camera_name requires renaming the keys below accordingly.
# (launch_ros only matches full node names, bare names are silently ignored.)
#
# NOTE: use real YAML types here (bool/int/float, not quoted strings).
# Parameter files are NOT type-coerced like launch args are; a quoted
# "100" sent to an int parameter crashes the node at startup.
/camera/orbbec:
  ros__parameters:
    # ---- orbbec_camera (astra.launch.py) ----
    camera_name: "camera"
    depth_registration: false
    serial_number: ""
    usb_port: ""
    device_num: 1
    vendor_id: "0x2bc5"
    product_id: ""
    enable_point_cloud: true
    enable_colored_point_cloud: false
    point_cloud_qos: "default"
    connection_delay: 100
    color_width: 640
    color_height: 480
    color_fps: 30
    color_format: "RGB"
    enable_color: false
    flip_color: false
    color_qos: "default"
    color_camera_info_qos: "default"
    enable_color_auto_exposure: true
    depth_width: 640
    depth_height: 480
    depth_fps: 30
    depth_format: "Y11"
    enable_depth: true
    flip_depth: false
    depth_qos: "default"
    depth_camera_info_qos: "default"
    ir_width: 640
    ir_height: 480
    ir_fps: 30
    ir_format: "Y10"
    enable_ir: false
    flip_ir: false
    ir_qos: "default"
    ir_camera_info_qos: "default"
    enable_ir_auto_exposure: true
    publish_tf: true
    tf_publish_rate: 10.0
    ir_info_url: ""
    color_info_url: ""
    log_level: "none"
    enable_publish_extrinsic: false
    enable_d2c_viewer: false
    enable_ldp: true
    enable_soft_filter: true
    soft_filter_max_diff: -1
    soft_filter_speckle_size: -1
    ordered_pc: false
    use_hardware_time: false
    enable_depth_scale: true
    align_mode: "HW"

/camera/color/v4l2_camera_node:
  ros__parameters:
    video_device: "/dev/video2"
    pixel_format: "YUYV"
    output_encoding: "rgb8"
    image_size: [640, 480]
